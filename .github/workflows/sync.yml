name: Data z PSMF a připomínky

on:
  schedule:
    # Připomínky ve 12:00 pražského času (10:05 UTC v létě, 11:05 UTC v zimě; program si hlídá, aby odešly jen jednou denně)
    - cron: "5 10 * * *"
    - cron: "5 11 * * *"
    # Další stažení výsledků během dne a večer po zápasech
    - cron: "35 5,15,19,22 * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Poslat testovací připomínku hned"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalace
        working-directory: sync
        run: npm install --omit=dev --no-audit --no-fund

      - name: Stažení dat z PSMF a připomínky
        working-directory: sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
          FORCE_NOTIFY: ${{ github.event.inputs.notify }}
        run: node sync.js

      # Kalendářové soubory pro iPhone (kalendar/*.ics) se uloží do repozitáře, aby byly na webu aplikace.
      - name: Uložit kalendářové soubory
        if: always()
        run: |
          if [ -d kalendar ] && [ -n "$(git status --porcelain kalendar)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A kalendar
            git commit -m "Kalendář zápasů"
            git push || (git pull --rebase && git push)
          else
            echo "Kalendářové soubory beze změny."
          fi

      # GitHub u veřejných repozitářů po 60 dnech bez změn vypíná plánované úlohy.
      # Pojistka 1: při každém běhu automat potvrdí, že má zůstat zapnutý.
      # Pojistka 2: když se v repozitáři 40 dní nic nezměnilo, zapíše malý udržovací záznam (to se počítá jako aktivita).
      - name: Udržet plánované spouštění
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable" || true
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Poslední změna v repozitáři před $days dny."
          if [ "$days" -ge 40 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/udrzovaci-zaznam.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/udrzovaci-zaznam.txt
            git commit -m "Udržovací záznam, aby GitHub nevypnul automat"
            git push || (git pull --rebase && git push)
          fi
